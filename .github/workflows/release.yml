name: Release Build for Windows

on:
  push:
    # Pattern matched against refs/tags
    tags:        
      - 'v[0-9]+.[0-9]+' 

permissions:
  contents: write

#env:
#  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    uses: ./.github/workflows/windows.yml  # Calls the build workflow

  release:
    runs-on: windows-2022
    needs: build
    steps:
    - name: Create Release
      run: gh release create ${{ github.ref }} ./dist/Exe-Build.zip --title "Release Title" --notes "Release notes here."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

       
      
