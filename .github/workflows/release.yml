name: Release Build for Windows

on:
  push:
    # Pattern matched against refs/tags
    tags:        
      - 'v[0-9]+.[0-9]+' 

permissions:
  contents: write

#env:
#  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    uses: ./.github/workflows/windows.yml  # Calls the build workflow

  release:
    runs-on: windows-2022
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Exe-Build

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          files: dist # Specify the path to your artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
